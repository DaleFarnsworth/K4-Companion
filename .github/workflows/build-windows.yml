# Builds k4companion.exe and its installer on a Windows runner.
#
# Run it by hand from the Actions tab (Build Windows, Run workflow) or
# with "gh workflow run build-windows.yml --ref <branch>"; the files are
# then under the run's Artifacts. Alongside k4companion.exe it builds
# k4companion-debug.exe, the same program with a console, so that -d
# and --da output can be seen on Windows; the installer installs both.

name: Build Windows

on:
  workflow_dispatch:
  # From release.yml, which puts what it builds in a release.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # 3.13 or later is needed for the encrypted connection on port 9204.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # hidapi is for the K-Pod; PyInstaller bundles only what the
      # program imports, so it costs nothing where it isn't used.
      # Pillow is for the build alone: it scales the splash screen.
      - name: Install the Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow PyQt6 pyqtgraph pyyaml opuslib numpy sounddevice \
              PySocks python-rtmidi pyserial hidapi

      # PyInstaller from its source, its bootloader -- the small program
      # each .exe starts with -- compiled here rather than the prebuilt
      # one every PyInstaller program shares, malware's included, which
      # Windows Defender's heuristics have learnt to distrust and which
      # had k4companion-installer.exe taken for Trojan:Win32/Ulthar.A!ml.
      # PYINSTALLER_COMPILE_BOOTLOADER has it built with the runner's
      # Visual C++ rather than the source package's own prebuilt copies.
      - name: Install PyInstaller with a bootloader of its own
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: 1
        run: pip install --no-binary pyinstaller pyinstaller

      # Stops the build if it wasn't: the bootloader installed is the one
      # in PyPI's wheel of the same version.
      - name: Check the bootloader was compiled here
        run: |
          python - <<'PYEOF'
          import hashlib, importlib.metadata, os, pathlib, subprocess, sys, tempfile, zipfile
          import PyInstaller
          version = importlib.metadata.version('pyinstaller')
          ours = pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe'
          wheels = tempfile.mkdtemp()
          subprocess.run([sys.executable, '-m', 'pip', 'download', f'pyinstaller=={version}',
                          '--only-binary=:all:', '--no-deps', '--platform', 'win_amd64', '-d', wheels],
                         check=True)
          wheel = next(pathlib.Path(wheels).glob('*.whl'))
          with zipfile.ZipFile(wheel) as z:
              stock = z.read('PyInstaller/bootloader/Windows-64bit-intel/runw.exe')
          mine = ours.read_bytes()
          print(f'PyInstaller {version}: runw.exe here {hashlib.sha256(mine).hexdigest()}')
          print(f'                     in the wheel {hashlib.sha256(stock).hexdigest()}')
          if mine == stock:
              sys.exit('The bootloader is the prebuilt one: it was not compiled here.')
          PYEOF

      - name: Read the version
        id: version
        run: |
          version=$(sed -n '/version =/{s/^[^"]*"//;s/".*//p;q}' example_config_files/k4companion.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      # As ./run does: the configuration copied into the program, so that
      # it needs no file of its own.
      - name: Embed the configuration
        run: python tools/add_data_variable -i k4companion -o k4companion.py example_config_files/k4companion.yaml

      # Both programs from one analysis, without the parts of Qt the
      # program never uses (see the spec). opus.dll goes into the bundle
      # as well as beside the .exe (the installer puts it there), so
      # that either way it is found.
      - name: Build k4companion.exe and k4companion-debug.exe
        run: pyinstaller --noconfirm tools/k4companion.spec

      - name: Build the installer
        run: |
          choco install nsis --yes --no-progress
          cp dist/k4companion.exe dist/k4companion-debug.exe Windows/
          "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION=${{ steps.version.outputs.version }} tools/k4companion.nsi
          mv k4companion-installer.exe dist/k4companion-installer.exe

      - name: Keep the files with the run
        uses: actions/upload-artifact@v7
        with:
          name: k4companion-windows
          path: dist/*.exe
